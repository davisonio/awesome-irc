name: CI
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    # weekly link-rot check, Mondays 06:17 UTC
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  awesome_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes awesome-lint readme.md
  link_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Exclusions and retry settings live in lychee.toml.
      # GITHUB_TOKEN is the built-in Actions token, used only to avoid
      # github.com rate limits on the many GitHub URLs in the list.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress readme.md contributing.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
